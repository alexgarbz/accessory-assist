name: iOS Tests

# Builds the app and runs the unit tests on every change to the Xcode project
# or its sources. Catalogue-only changes are handled by validate-catalogue.yml.
on:
  push:
    paths:
      - "AccessoryAssist/**"
      - "AccessoryAssist.xcodeproj/**"
      - ".github/workflows/ios-tests.yml"
  pull_request:
    paths:
      - "AccessoryAssist/**"
      - "AccessoryAssist.xcodeproj/**"
      - ".github/workflows/ios-tests.yml"
  workflow_dispatch:

jobs:
  test:
    name: Build and test
    # The project is saved in the Xcode 26 project format (objectVersion 100),
    # which older Xcode cannot open at all. The runner image has to match.
    runs-on: macos-26
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          ls /Applications | grep -i '^Xcode' || true

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project AccessoryAssist.xcodeproj \
            -scheme AccessoryAssist \
            -destination 'platform=iOS Simulator,OS=latest,name=iPhone 17 Pro' \
            CODE_SIGNING_ALLOWED=NO
